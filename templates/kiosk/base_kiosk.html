<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{% block title %}Built to Work Kiosk{% endblock %}</title>
<style>
  :root{--red:#c1121f;--black:#0a0a0a;--white:#ffffff;--gray:#f2f2f2;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }
  header.kiosk-header{
    background:var(--black);
    border-bottom:6px solid var(--red);
    padding:22px 32px;
    text-align:center;
  }
  header.kiosk-header h1{
    margin:0;font-size:28px;letter-spacing:.5px;
    color:var(--white);
  }
  header.kiosk-header .tag{color:var(--red);font-weight:700;}
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:40px 20px 60px;
    width:100%;
  }
  .kiosk-card{
    background:var(--white);
    color:var(--black);
    border-radius:20px;
    padding:36px;
    width:100%;
    max-width:640px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .btn{
    display:inline-block;
    background:var(--red);
    color:var(--white);
    border:none;
    border-radius:14px;
    padding:22px 28px;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    width:100%;
    text-align:center;
    text-decoration:none;
  }
  .btn:active{transform:scale(0.98);}
  .btn.secondary{background:var(--black);}
  input[type=text]{
    width:100%;
    font-size:22px;
    padding:18px;
    border-radius:12px;
    border:2px solid #ccc;
    margin-bottom:16px;
  }
  .error-box{
    background:#fdeaea;
    border:2px solid var(--red);
    color:var(--red);
    border-radius:12px;
    padding:18px;
    margin-bottom:20px;
    font-weight:600;
    text-align:center;
  }
  .muted{color:#666;text-align:center;font-size:15px;}
</style>
{% block extrastyle %}{% endblock %}
</head>
<body>
<header class="kiosk-header">
  <h1>Built to Work <span class="tag">&mdash; Kiosk</span></h1>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
