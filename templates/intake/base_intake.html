<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>{% block title %}Built to Work - Job Seekers{% endblock %}</title>
<style>
  :root { --btw-red: #c1121f; --btw-black: #111111; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #111111;
  }
  header.btw-header {
    background: var(--btw-black);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header.btw-header .logo {
    color: #ffffff;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.5px;
  }
  header.btw-header .logo span { color: var(--btw-red); }
  .btw-banner {
    background: var(--btw-red);
    color: #ffffff;
    text-align: center;
    padding: 14px 16px;
  }
  .btw-banner .small { font-size: 13px; margin: 0 0 4px; }
  .btw-banner .big { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  .field { margin-bottom: 18px; }
  .field-row { display: flex; gap: 16px; }
  .field-row .field { flex: 1; }
  label.field-label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  label.field-label .req { color: var(--btw-red); }
  .field-help { font-size: 12px; color: #555555; margin: 2px 0 6px; }
  input[type=text], input[type=email], input[type=tel], input[type=date],
  textarea, select {
    width: 100%;
    border: 1px solid #bbbbbb;
    border-radius: 3px;
    padding: 12px 12px;
    font-size: 16px;
    font-family: inherit;
    background: #ffffff;
    color: #111111;
  }
  textarea { min-height: 90px; resize: vertical; }
  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
  .choice-grid.single-col { grid-template-columns: 1fr; }
  .choice-row { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; padding: 8px 0; min-height: 24px; }
  .choice-row input { margin-top: 3px; width: 20px; height: 20px; flex-shrink: 0; }

  @media (max-width: 520px) {
    main { padding: 16px 14px 50px; }
    .field-row { flex-direction: column; gap: 0; }
    .choice-grid { grid-template-columns: 1fr; }
    header.btw-header .logo { font-size: 17px; }
    .btw-banner .big { font-size: 17px; }
    .btw-banner .small { font-size: 12px; }
    .btw-btn { padding: 16px 20px; font-size: 17px; }
  }
  .section-title {
    font-weight: 800;
    font-size: 16px;
    margin: 28px 0 4px;
    border-top: 2px solid #eeeeee;
    padding-top: 20px;
  }
  .disclaimer { font-size: 12px; color: #555555; margin-top: 6px; }
  .btw-btn {
    display: inline-block;
    width: 100%;
    background: var(--btw-red);
    color: #ffffff;
    border: none;
    border-radius: 3px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
  }
  .error-box {
    background: #fdecec;
    border: 1px solid var(--btw-red);
    color: #8a0f18;
    padding: 12px 14px;
    border-radius: 4px;
    margin-bottom: 18px;
    font-size: 14px;
  }
  .card { max-width: 480px; margin: 60px auto; text-align: center; padding: 0 16px; }
  .card h1 { font-size: 22px; }
</style>
{% block extrastyle %}{% endblock %}
</head>
<body>
<header class="btw-header">
  <div class="logo">BUILT<span>2</span>WORK</div>
</header>
{% block banner %}{% endblock %}
{% block content %}{% endblock %}
</body>
</html>
