<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Built to Work — Sign In{% endblock %}</title>
<style>
  :root{--red:#c1121f;--black:#0a0a0a;--white:#ffffff;--gray:#f2f2f2;}
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  header.top{
    background:var(--black);
    border-bottom:5px solid var(--red);
    padding:18px 20px;
    text-align:center;
  }
  header.top h1{margin:0;font-size:20px;}
  header.top .tag{color:var(--red);font-weight:700;}
  main{padding:22px 16px 70px;max-width:520px;margin:0 auto;}
  .card{background:var(--white);color:var(--black);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.5);}
  h2{margin-top:0;font-size:22px;}
  .muted{color:#666;font-size:14px;}
  label.field-label{display:block;font-weight:700;font-size:14px;margin:18px 0 6px;}
  label.field-label .req{color:var(--red);}
  input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{
    width:100%;font-size:16px;padding:13px;border-radius:10px;border:2px solid #ccc;font-family:inherit;
  }
  textarea{resize:vertical;}
  .checkbox-row{display:flex;align-items:flex-start;gap:10px;margin-top:18px;font-size:14px;}
  .checkbox-row input{width:20px;height:20px;flex:none;margin-top:2px;}
  .choice{display:flex;align-items:center;gap:12px;background:var(--gray);border:2px solid transparent;border-radius:12px;padding:14px;margin-bottom:8px;font-size:16px;}
  .choice.checked{border-color:var(--red);background:#fdeaea;font-weight:700;}
  .choice input{width:20px;height:20px;flex:none;}
  .btn{
    display:block;width:100%;background:var(--red);color:var(--white);border:none;border-radius:12px;
    padding:18px;font-size:18px;font-weight:700;margin-top:26px;cursor:pointer;text-align:center;text-decoration:none;
  }
  .error-box{background:#fdeaea;border:2px solid var(--red);color:var(--red);border-radius:10px;padding:14px;margin-bottom:16px;font-weight:600;font-size:14px;}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#888;font-weight:700;margin:26px 0 6px;border-top:1px solid #eee;padding-top:18px;}
</style>
{% block extrastyle %}{% endblock %}
</head>
<body>
<header class="top"><h1>Built to Work <span class="tag">&mdash; Sign In</span></h1></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
